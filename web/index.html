<!doctype html>
<html lang="en">
  <head>
    <script>
      // Model: web.PreviewView — a page of an app previewed under /preview/<port>/
      // that reloaded or followed a link to its own path landed here; send it back.
      (function () {
        var m = /^aie-preview:(\d+)$/.exec(window.name || '');
        if (m && location.pathname.indexOf('/preview/') !== 0) {
          location.replace('/preview/' + m[1] + location.pathname + location.search + location.hash);
          // Not window.stop(): it would cancel the replace too. This swallows
          // the rest of the page, so aie-studio's own app never starts here.
          document.write('<plaintext style="display:none">');
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AI Studio</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#1e1e1e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="R-IDE" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
